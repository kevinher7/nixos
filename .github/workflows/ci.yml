name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Run statix linting
        run: nix run nixpkgs#statix -- check .

  # macbook (kebee) is aarch64-darwin and cannot be built on a Linux runner,
  # so we evaluate it here as a safety net. The Linux hosts are covered by `build`.
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

  # Build the x86_64-linux hosts and push the results to Cachix. Building
  # implies evaluation, so these hosts don't need a separate eval step. Each
  # host builds in its own matrix job so they run in parallel.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [beans-btw, uribo-btw]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Use nix-fast-build with --skip-cached so we only download and build
      # store paths that aren't already in a substituter. Plain `nix build` on
      # the toplevel realises the entire ~10 GiB closure onto the runner (which
      # is then discarded) even when nothing changed; this skips that busywork
      # and falls back to eval-only on a fully-cached run.
      - name: Build ${{ matrix.host }} configuration
        run: >
          nix run nixpkgs#nix-fast-build -- --skip-cached --no-nom
          --flake '.#nixosConfigurations."${{ matrix.host }}".config.system.build.toplevel'
