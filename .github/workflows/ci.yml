name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macbook (kebee) is aarch64-darwin and cannot be built on a Linux runner,
  # so we evaluate it here as a safety net. Linux checks are covered by `build`.
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

  # Build every x86_64-linux flake check in one shared evaluation. This covers
  # the pre-commit hooks and every NixOS host closure while avoiding duplicate
  # runner setup and store-cache restoration for each host.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-checks-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-checks-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-checks-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Cachix creates a user config whose substituters take precedence over
      # /etc/nix/nix.conf, so Numtide must be added to that config afterwards.
      - name: Configure Numtide cache
        run: |
          cat <<'EOF' >> "$HOME/.config/nix/nix.conf"
          extra-substituters = https://cache.numtide.com
          extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          EOF

      - name: Verify Numtide cache
        run: |
          nix config show substituters | grep --fixed-strings --quiet https://cache.numtide.com
          nix config show trusted-public-keys | grep --fixed-strings --quiet niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Run Linux checks
        run: >
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --skip-cached --no-nom --no-link --stream-json-lines
          --flake '.#checks.x86_64-linux'
