name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: Run Linux builds on the self-hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stays on a hosted runner so a broken self-hosted runner never blocks lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Run pre-commit checks
        run: nix build .#checks.x86_64-linux.pre-commit-check

  # macbook (kebee) is aarch64-darwin and cannot be built on Linux, so it is
  # evaluated on hosted infrastructure as a safety net.
  darwin-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

  # Build one host at a time to avoid concurrent evaluation and build pressure.
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.use_self_hosted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          useDaemon: false

      - name: Build NixOS configurations
        shell: bash
        run: |
          set -euo pipefail

          outputs=()
          for host in beans-btw kebean uribo-btw; do
            output=$(nix build \
              --no-link \
              --print-out-paths \
              --max-jobs 1 \
              --cores 2 \
              ".#nixosConfigurations.${host}.config.system.build.toplevel")
            outputs+=("$output")
          done

          cachix push kevinher7-nixos "${outputs[@]}"

  # This job cannot run unless a maintainer manually opts in. It uses the
  # prospective runner's exact labels, so normal CI remains on GitHub-hosted
  # infrastructure while the runner is disabled or under investigation.
  build-self-hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.use_self_hosted == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nixos, x86_64-linux]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Store scanning can upload paths created by unrelated host activity.
      # Push only the system outputs produced below. The runner user is not a
      # trusted Nix user and the host daemon already has the cache configured,
      # so do not try to write the substituter into nix.conf.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          skipAddingSubstituter: true
          useDaemon: false

      - name: Build NixOS configurations
        shell: bash
        run: |
          set -euo pipefail

          outputs=()
          for host in beans-btw kebean uribo-btw; do
            output=$(nix build \
              --no-link \
              --print-out-paths \
              --max-jobs 1 \
              --cores 2 \
              ".#nixosConfigurations.${host}.config.system.build.toplevel")
            outputs+=("$output")
          done

          cachix push kevinher7-nixos "${outputs[@]}"
