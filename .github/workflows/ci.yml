name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # No store cache here: statix barely touches the store, so the ~4s
      # restore is a net loss for this job.
      - name: Run statix linting
        run: nix run --inputs-from . nixpkgs#statix -- check .

  # macbook (kebee) is aarch64-darwin and cannot be built on a Linux runner,
  # so we evaluate it here as a safety net. The Linux hosts are covered by `build`.
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

  # Build the x86_64-linux hosts and push the results to Cachix. Building
  # implies evaluation, so these hosts don't need a separate eval step. Each
  # host builds in its own matrix job so they run in parallel.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        host: [beans-btw, kebean, uribo-btw]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-build-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-build-${{ matrix.host }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-build-${{ matrix.host }}-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Cachix creates a user config whose substituters take precedence over
      # /etc/nix/nix.conf, so Numtide must be added to that config afterwards.
      - name: Configure Numtide cache
        run: |
          cat <<'EOF' >> "$HOME/.config/nix/nix.conf"
          extra-substituters = https://cache.numtide.com
          extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          EOF

      - name: Verify Numtide cache
        run: |
          nix config show substituters | grep --fixed-strings --quiet https://cache.numtide.com
          nix config show trusted-public-keys | grep --fixed-strings --quiet niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Build ${{ matrix.host }} configuration
        run: >
          nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom
          --flake '.#nixosConfigurations."${{ matrix.host }}".config.system.build.toplevel'
