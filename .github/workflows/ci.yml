name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-lint-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-lint-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-lint-
          purge-created: 0
          purge-primary-key: never

      - name: Run statix linting
        run: nix run nixpkgs#statix -- check .

  # macbook (kebee) is aarch64-darwin and cannot be built on a Linux runner,
  # so we evaluate it here as a safety net. The Linux hosts are covered by `build`.
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-eval-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-eval-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-eval-
          purge-created: 0
          purge-primary-key: never

      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

  # Build the x86_64-linux hosts and push the results to Cachix. Building
  # implies evaluation, so these hosts don't need a separate eval step. Each
  # host builds in its own matrix job so they run in parallel.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [beans-btw, uribo-btw]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-build-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-build-${{ matrix.host }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-build-${{ matrix.host }}-
          purge-created: 0
          purge-primary-key: never

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.host }} configuration
        run: >
          nix run nixpkgs#nix-fast-build -- --skip-cached --no-nom
          --flake '.#nixosConfigurations."${{ matrix.host }}".config.system.build.toplevel'
