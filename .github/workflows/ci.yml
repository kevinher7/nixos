name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stays on a hosted runner so a broken self-hosted runner never blocks lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Run pre-commit checks
        run: nix build .#checks.x86_64-linux.pre-commit-check

  # Runs on the self-hosted runner, a NixOS container on uribo-btw sharing the
  # host's /nix/store, so Nix and the host's substituters are already there.
  # Building implies evaluation, so the Linux hosts need no separate eval
  # step. One ephemeral runner would serialize a matrix, so a single
  # nix-fast-build call builds every nixosConfiguration at once.
  build:
    runs-on: [self-hosted, nixos, x86_64-linux]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner user is not a trusted Nix user: it cannot add substituters
      # (the host already declares this cache) and the daemon ignores its
      # post-build-hook, so push new store paths after the build instead.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true
          useDaemon: false

      # macbook (kebee) is aarch64-darwin and cannot be built on Linux, so it
      # is evaluated as a safety net.
      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

      # Two eval workers, restarted past 2 GiB each, keep evaluation of all
      # hosts inside the runner container's memory limit.
      - name: Build NixOS configurations
        run: >
          nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom
          --eval-workers 2 --eval-max-memory-size 2048
          --flake '.#nixosConfigurations'
          --select 'hosts: builtins.mapAttrs (_: host: host.config.system.build.toplevel) hosts'
