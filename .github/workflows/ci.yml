name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stays on a hosted runner so a broken self-hosted runner never blocks lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Run pre-commit checks
        run: nix build .#checks.x86_64-linux.pre-commit-check

  # macbook (kebee) is aarch64-darwin and cannot be built on Linux, so it is
  # evaluated on hosted infrastructure as a safety net.
  darwin-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Evaluate macbook configuration
        run: >
          nix eval --show-trace
          '.#darwinConfigurations."kebee".config.system.build.toplevel.outPath'

  # Build one host at a time to avoid concurrent evaluation and build pressure.
  build:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'nixos' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      # Store scanning can upload paths created by unrelated host activity.
      # Push only the system outputs produced below. On the self-hosted runner
      # the runner user is not a trusted Nix user and the host daemon already
      # has the cache configured, so do not write the substituter into nix.conf.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kevinher7-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
          skipAddingSubstituter: ${{ runner.environment == 'self-hosted' }}
          useDaemon: false

      - name: Build NixOS configurations
        shell: bash
        run: |
          set -euo pipefail

          : > "$RUNNER_TEMP/outputs"
          for host in beans-btw kebean uribo-btw; do
            output=$(nix build \
              --no-link \
              --print-out-paths \
              --max-jobs 1 \
              --cores 2 \
              ".#nixosConfigurations.${host}.config.system.build.toplevel")
            echo "${host} ${output}" >> "$RUNNER_TEMP/outputs"
          done

      # Root main's closures on uribo-btw so Harmonia keeps serving them
      # across garbage collection. Each push overwrites the previous root, so
      # one generation per host survives. The directory is bind-mounted from
      # the host, so the roots stay valid outside the ephemeral container.
      - name: Keep main closures on the self-hosted cache
        if: github.ref == 'refs/heads/main' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail

          while read -r host output; do
            nix-store --add-root "/var/lib/ci-runner/gcroots/${host}" --realise "$output" > /dev/null
          done < "$RUNNER_TEMP/outputs"

      - name: Push main closures to Cachix
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          cut -d ' ' -f 2 "$RUNNER_TEMP/outputs" | xargs cachix push kevinher7-nixos
