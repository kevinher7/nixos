name: Update flake.lock

on:
  schedule:
    - cron: "0 0 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Snapshot current lockfile
        run: cp flake.lock "$RUNNER_TEMP/flake.lock.before"

      - name: Update flake.lock
        run: |
          set -o pipefail
          nix flake update --commit-lock-file 2>&1 | tee "$RUNNER_TEMP/flake-update-output.txt"

      - name: Generate pull request body
        run: |
          node .github/scripts/generate-flake-update-body.mjs \
            "$RUNNER_TEMP/flake.lock.before" \
            flake.lock \
            "$RUNNER_TEMP/pr-body.md" \
            "$RUNNER_TEMP/flake-update-output.txt"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CREATE_PR_TOKEN }}
          branch: chore/update-flake-lock
          title: "chore: update flake.lock"
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.CREATE_PR_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
